name: Сборка

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - run: npx tauri icon app-icon.svg
      - run: npx tauri build --bundles deb,appimage
      - name: rpm (Fedora, openSUSE), не критично
        continue-on-error: true
        run: npx tauri build --bundles rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-appimage
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

  flatpak:
    needs: linux
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: linux-deb-appimage, path: linux-art }
      - run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          cp "$(find linux-art -name '*.deb' | head -1)" flatpak/ssh-constructor.deb
          cd flatpak
          flatpak-builder --user --force-clean --install-deps-from=flathub --repo=repo build org.example.sshconstructor.yml
          flatpak build-bundle repo ssh-constructor.flatpak org.example.sshconstructor
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: flatpak/ssh-constructor.flatpak

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install
      - run: npx tauri icon app-icon.svg
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Android SDK и NDK (уже есть на раннере)
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          ls "$ANDROID_NDK_LATEST_HOME" | head -3
      - run: npm install
      - run: npx tauri icon app-icon.svg
      - run: npx tauri android init
      - run: npx tauri android build --apk --debug --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
