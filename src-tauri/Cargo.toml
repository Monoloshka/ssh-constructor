[package]
name = "ssh-constructor"
version = "0.1.0"
edition = "2021"

[lib]
name = "ssh_constructor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
russh = "0.44"
russh-keys = "0.44"
async-trait = "0.1"
tokio = { version = "1", features = ["time", "sync"] }
