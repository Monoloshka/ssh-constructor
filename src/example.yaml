app:
  name: Роутер OpenWrt

pages:
  # Список служб строится сам из /etc/init.d: добавлять вручную ничего не нужно
  - title: Службы
    items:
      - services: openwrt

  - title: Пинг
    items:
      - field: site
        label: Сайт
        type: host
        placeholder: google.com
      - field: count
        label: Количество
        type: number
        default: 4
      - field: proto
        label: Протокол
        type: choice
        options: { IPv4: "-4", IPv6: "-6" }
      - button: Старт
        run: ping {site} {proto} -c {count}

  - title: Состояние
    items:
      - progress: Оперативная память
        source: memory
      - progress: Хранилище (как в LuCI)
        source: disk
      - button: Аптайм и нагрузка
        run: uptime

  - title: Питание
    items:
      # Цепочка с запасным вариантом: на разных системах команда может отличаться
      - button: Перезапустить SSH-сервер
        confirm: true
        run:
          - cmd: systemctl restart ssh
            fail_if: "not found"
            fallback:
              - /etc/init.d/dropbear restart
      - button: Перезагрузить устройство
        reboot: true          # после команды программа сама дождётся устройства и переподключится
        run: reboot
