app:
  name: Роутер OpenWrt

pages:
  # Список служб строится сам из /etc/init.d: добавлять вручную ничего не нужно
  - title: Службы
    items:
      - services: openwrt

  - title: Пинг
    items:
      - field: site
        label: Сайт
        type: host
        default: google.com
      - field: count
        label: Количество
        type: number
        default: 4
      - field: proto
        label: Протокол
        type: choice
        options: { IPv4: "-4", IPv6: "-6" }
      - button: Старт
        run: ping {site} {proto} -c {count}
        show: output

  - title: Состояние
    items:
      - progress: Оперативная память
        source: memory
      - progress: Хранилище (как в LuCI)
        source: disk          # на OpenWrt берётся /overlay; другой путь: path: /tmp
      - button: Аптайм и нагрузка
        run: uptime
