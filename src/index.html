<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSH Конструктор</title>
<style>
:root{--bg:#fff;--fg:#1b1f24;--card:#f3f5f8;--line:#d0d7de;--acc:#2563eb;--err:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--fg:#e6edf3;--card:#1a2029;--line:#303944;--acc:#4c8dff}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:760px;margin:0 auto;padding:16px}
h1,h2{margin:.4em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
label{display:block;margin:8px 0 2px;font-size:.9em;opacity:.8}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;cursor:pointer;margin:6px 6px 0 0}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.fav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.fav:last-child{border:0}.fav b{cursor:pointer}.fav small{opacity:.7;display:block}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.tabs button{background:transparent;color:var(--fg);border:1px solid var(--line);white-space:nowrap;margin:0}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
pre{background:#000;color:#cfe;padding:10px;border-radius:8px;overflow:auto;white-space:pre-wrap;max-height:50vh;margin:8px 0 0}
progress{width:100%;height:20px}
.err{color:var(--err)}.ok{color:#16a34a}table{border-collapse:collapse;width:100%;font-size:.88em}th,td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}td.n{text-align:right}tr.off td{opacity:.6}
button.sm{padding:3px 8px;margin:1px;font-size:.85em}.hint{font-size:.85em;opacity:.75;margin:4px 0}.hide{display:none}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);max-width:90vw}
</style>
</head>
<body>
<main>
  <h1>SSH Конструктор</h1>

  <section id="login">
    <div class="card"><b>Избранное</b><div id="favs"></div></div>
    <div class="card">
      <div class="row">
        <div><label>Имя</label><input id="f-name" placeholder="Домашний роутер"></div>
        <div><label>Хост (IP или домен)</label><input id="f-host" placeholder="192.168.1.1" autocapitalize="off"></div>
      </div>
      <div class="row">
        <div><label>Порт</label><input id="f-port" type="number" value="22"></div>
        <div><label>Пользователь</label><input id="f-user" value="root" autocapitalize="off"></div>
      </div>
      <label>Пароль (или passphrase ключа). Нигде не сохраняется</label>
      <input id="f-pass" type="password" autocomplete="current-password">
      <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="f-show" style="width:auto"> Показать пароль</label>
      <details><summary>SSH-ключ (необязательно)</summary>
        <label>Путь к файлу ключа</label><input id="f-key" placeholder="/home/user/.ssh/id_ed25519"></details>
      <button id="b-connect">Подключиться</button>
      <button id="b-save" class="sec">Добавить в избранное</button>
      <div id="login-err" class="err"></div>
    </div>
  </section>

  <section id="appscr" class="hide">
    <div class="row" style="align-items:center">
      <div id="who"></div>
      <select id="app-pick"></select>
      <div><button id="b-edit" class="sec">Редактор</button><button id="b-file" class="sec">Открыть файл…</button><button id="b-out" class="sec">Выйти</button></div>
    </div>
    <div id="editor" class="card hide">
      <b>Описание приложения</b>
      <div class="hint">Это текст (YAML): какие вкладки, кнопки, поля и полосы показывать. Меняйте его прямо здесь, без файлов. Пример уже открыт ниже, измените и нажмите «Сохранить».</div>
      <label>Название (под ним сохранится в списке)</label><input id="ed-name">
      <label>Текст</label><textarea id="ed-text" rows="16" spellcheck="false" style="font-family:monospace"></textarea>
      <button id="ed-save">Сохранить и открыть</button><button id="ed-close" class="sec">Закрыть</button><button id="ed-del" class="sec">Удалить это</button>
    </div>
    <input id="file-in" type="file" accept=".yaml,.yml,.txt" class="hide">
    <div id="tabs" class="tabs"></div>
    <div id="page"></div>
  </section>
</main>

<dialog id="dlg"><p id="dlg-text" style="white-space:pre-wrap"></p>
  <button id="dlg-yes">Да</button><button id="dlg-no" class="sec">Нет</button></dialog>

<script>
const {invoke}=window.__TAURI__.core;
const $=s=>document.querySelector(s);
const el=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==='class')e.className=v;else if(a.startsWith('on'))e.addEventListener(a.slice(2),v);else e.setAttribute(a,v)}e.append(...k);return e};
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let favs=load('favs',[]), fps=load('fps',{}), apps=load('apps',{}), doc=null, curPage=0;
const UNITS={B:1,KB:1024,MB:1048576,GB:1073741824};

function ask(text){return new Promise(res=>{const d=$('#dlg');$('#dlg-text').textContent=text;
  const done=v=>{d.close();res(v)};$('#dlg-yes').onclick=()=>done(true);$('#dlg-no').onclick=()=>done(false);d.showModal()})}

/* ---------- избранное и вход ---------- */
function renderFavs(){
  const box=$('#favs');box.replaceChildren();
  if(!favs.length){box.append(el('small',{},'Пока пусто'));return}
  favs.forEach((f,i)=>box.append(el('div',{class:'fav'},
    el('div',{},el('b',{onclick:()=>fill(f)},f.name||f.host),el('small',{},`${f.user}@${f.host}:${f.port}`)),
    el('button',{class:'sec',onclick:()=>{favs.splice(i,1);save('favs',favs);renderFavs()}},'Удалить'))));
}
function fill(f){$('#f-name').value=f.name||'';$('#f-host').value=f.host;$('#f-port').value=f.port;$('#f-user').value=f.user;$('#f-pass').focus()}
function formData(){return{name:$('#f-name').value.trim(),host:$('#f-host').value.trim(),port:+$('#f-port').value||22,user:$('#f-user').value.trim()}}

$('#b-save').onclick=()=>{
  const f=formData();if(!f.host||!f.user){$('#login-err').textContent='Укажите хост и пользователя';return}
  const i=favs.findIndex(x=>x.host===f.host&&x.port===f.port&&x.user===f.user);
  if(i>=0)favs[i]=f;else favs.push(f);save('favs',favs);renderFavs();$('#login-err').textContent='';
};

async function tryConnect(f,pw,key,err){
  const fail=m=>{err.className='err';err.textContent=m;return false};
  err.className='';err.textContent='Подключение…';
  if(!f.host||!f.user)return fail('Укажите хост и пользователя');
  const id=`${f.host}:${f.port}`;let trust=false;
  for(let i=0;i<2;i++){
    try{
      const fp=await invoke('connect',{host:f.host,port:f.port,user:f.user,password:pw,keyPath:key||null,knownFp:fps[id]||null,trust});
      fps[id]=fp;save('fps',fps);err.textContent='';return true;
    }catch(e){
      e=String(e);
      if(e.startsWith('KEY:')){
        const [,kind,...r]=e.split(':'),fp=r.join(':');
        const q=kind==='CHANGED'?`ВНИМАНИЕ! Ключ сервера ${id} изменился.\nЭто может быть подмена. Новый отпечаток:\n${fp}\n\nВсё равно доверять?`
                                :`Первое подключение к ${id}.\nОтпечаток ключа:\n${fp}\n\nДоверять этому серверу?`;
        if(!(await ask(q)))return fail('Подключение отменено');
        trust=true;continue;
      }
      return fail(e);
    }
  }
  return false;
}
$('#b-connect').onclick=async()=>{const f=formData();if(await tryConnect(f,$('#f-pass').value,$('#f-key').value.trim(),$('#login-err'))){$('#f-pass').value='';enterApp(f)}};
$('#f-show').onchange=e=>{$('#f-pass').type=e.target.checked?'text':'password'};

/* ---------- экран приложения ---------- */
async function enterApp(f){
  $('#login').classList.add('hide');$('#appscr').classList.remove('hide');
  $('#who').textContent=`${f.user}@${f.host}`;
  await refreshPick();
}
async function refreshPick(sel){
  const pick=$('#app-pick');pick.replaceChildren(el('option',{value:'@example'},'Пример'));
  Object.keys(apps).forEach(n=>pick.append(el('option',{value:n},n)));
  if(sel)pick.value=sel;
  await openApp(pick.value);
}
async function openApp(name){
  let text;
  if(name==='@example')text=await (await fetch('example.yaml')).text();else text=apps[name];
  try{doc=await invoke('parse_yaml',{text});curPage=0;renderTabs();renderPage()}
  catch(e){$('#page').replaceChildren(el('div',{class:'err'},'Ошибка в файле описания: '+e))}
}
$('#app-pick').onchange=e=>openApp(e.target.value);
$('#b-file').onclick=()=>$('#file-in').click();
$('#file-in').onchange=async e=>{const f=e.target.files[0];if(!f)return;apps[f.name]=await f.text();save('apps',apps);e.target.value='';refreshPick(f.name)};
$('#b-out').onclick=async()=>{await invoke('disconnect');$('#appscr').classList.add('hide');$('#login').classList.remove('hide')};


$('#b-edit').onclick=async()=>{
  const n=$('#app-pick').value;
  $('#ed-name').value=n==='@example'?'мой-сервер.yaml':n;
  $('#ed-text').value=n==='@example'?await (await fetch('example.yaml')).text():apps[n];
  $('#editor').classList.remove('hide');
};
$('#ed-close').onclick=()=>$('#editor').classList.add('hide');
$('#ed-save').onclick=async()=>{const n=$('#ed-name').value.trim();if(!n)return;apps[n]=$('#ed-text').value;save('apps',apps);$('#editor').classList.add('hide');await refreshPick(n)};
$('#ed-del').onclick=async()=>{const n=$('#ed-name').value.trim();if(apps[n]&&await ask(`Удалить «${n}»?`)){delete apps[n];save('apps',apps);$('#editor').classList.add('hide');await refreshPick()}};

function renderTabs(){
  const t=$('#tabs');t.replaceChildren();
  (doc.pages||[]).forEach((p,i)=>t.append(el('button',{class:i===curPage?'on':'',onclick:()=>{curPage=i;renderTabs();renderPage()}},p.title||('Страница '+(i+1)))));
}

/* ---------- подстановка значений в команды ---------- */
const q=s=>"'"+String(s).replace(/'/g,"'\\''")+"'";
function build(cmd,fields){
  return cmd.replace(/\{(\w+)\}/g,(_,n)=>{
    const f=fields[n];if(!f)throw new Error(`В команде есть {${n}}, но такого поля нет`);
    const v=f.el.value;
    switch(f.def.type){
      case'host':if(!/^[A-Za-z0-9._:-]+$/.test(v))throw new Error(`Поле «${f.def.label||n}»: недопустимый адрес`);return v;
      case'number':if(!/^-?\d+$/.test(v))throw new Error(`Поле «${f.def.label||n}»: нужно число`);return v;
      case'choice':return v; // значения берутся из файла описания, а не вводятся вручную
      default:return q(v);
    }
  });
}

async function exec(cmd){const r=await invoke('run_command',{command:cmd});return r}

const SOURCES={ // команды выводят "всего занято" в килобайтах; работают и на BusyBox (OpenWrt)
  memory:{mul:1024,cmd:"awk '/^MemTotal/{t=$2}/^MemAvailable/{a=$2}/^MemFree/{f=$2}END{if(!a)a=f;print t,t-a}' /proc/meminfo"},
  disk:{mul:1024,cmd:"df -kP $([ -d /overlay ] && echo /overlay || echo /) | awk 'NR==2{print $2,$3}'"}
};


/* ---------- список служб OpenWrt (/etc/init.d) ---------- */
const SVC_LIST=['for i in /etc/init.d/*; do n=${i##*/}; e=0; $i enabled >/dev/null 2>&1 && e=1; r=0; $i running >/dev/null 2>&1 && r=1; echo "S $n $e $r"; done','echo U','ubus call service list 2>/dev/null'].join('\n');
const SVC_SAMPLE=['snap(){ for p in $P; do [ -r /proc/$p/stat ] && echo "$p $(sed \'s/.*) //\' /proc/$p/stat | awk \'{print $12+$13}\') $(awk \'/VmRSS/{print $2}\' /proc/$p/status)"; done; }',
 'ct(){ awk \'/^cpu /{s=0;for(i=2;i<=NF;i++)s+=$i;print s}\' /proc/stat; }',
 'mt=$(awk \'/^MemTotal/{print $2}\' /proc/meminfo)',
 'a=$(snap); c1=$(ct); sleep 1; b=$(snap); c2=$(ct)',
 'echo "T $mt $((c2-c1))"; echo "$a" | sed \'s/^/A /\'; echo "$b" | sed \'s/^/B /\''].join('\n');
const RISKY=['dropbear','network'];

function renderServices(card){
  const filter=el('input',{placeholder:'Поиск по названию…'});
  const only=el('input',{type:'checkbox',style:'width:auto'});
  const info=el('div',{class:'hint',style:'white-space:pre-wrap'});
  const box=el('div',{style:'overflow-x:auto;margin-top:8px'});
  let rows=[];
  card.append(el('b',{},'Службы (из /etc/init.d)'),filter,
    el('label',{style:'display:flex;gap:6px;align-items:center'},only,'Только запущенные'),
    el('button',{class:'sec',onclick:refresh},'Обновить'),info,box,
    el('div',{class:'hint'},'CPU и RAM показаны для служб, которыми управляет procd (в процентах от всей системы). У остановленных служб эти поля пустые. «Перезагрузка» заставляет службу перечитать настройки, не останавливая её.'));
  filter.oninput=draw;only.onchange=draw;

  async function refresh(){
    info.textContent='Обновление…';
    try{
      const r=await exec(SVC_LIST);const [head,ub='']=r.output.split(/\nU\n/);
      const pids={};
      try{const j=JSON.parse(ub);for(const [n,v] of Object.entries(j))for(const ins of Object.values(v.instances||{}))if(ins.pid)(pids[n]=pids[n]||[]).push(+ins.pid)}catch{}
      rows=head.split('\n').filter(l=>l.startsWith('S ')).map(l=>{const [,n,e,r]=l.split(' ');return{n,en:e==='1',run:r==='1',pids:pids[n]||[],cpu:null,mem:null}})
        .filter(x=>/^[A-Za-z0-9._@-]+$/.test(x.n)).sort((a,b)=>a.n.localeCompare(b.n));
      const all=[...new Set(rows.flatMap(x=>x.pids))].filter(Number.isInteger);
      if(all.length){
        const s=await exec(`P="${all.join(' ')}"\n`+SVC_SAMPLE);
        const A={},B={};let mt=0,dt=0;
        for(const l of s.output.split('\n')){const f=l.trim().split(/\s+/);
          if(f[0]==='T'){mt=+f[1];dt=+f[2]}else if(f[0]==='A')A[f[1]]=[+f[2],+f[3]];else if(f[0]==='B')B[f[1]]=[+f[2],+f[3]]}
        for(const x of rows){let c=0,m=0,ok=false;
          for(const p of x.pids)if(A[p]&&B[p]){ok=true;c+=B[p][0]-A[p][0];m+=B[p][1]||0}
          if(ok&&dt>0&&mt>0){x.cpu=c/dt*100;x.mem=m/mt*100}}
      }
      info.textContent=`Служб: ${rows.length}, запущено: ${rows.filter(x=>x.run).length}`;draw();
    }catch(e){info.textContent='Ошибка: '+e}
  }

  async function act(x,verb){
    if((verb==='stop'||verb==='kill'||verb==='disable')&&RISKY.includes(x.n)&&!(await ask(`«${x.n}» нужна для связи с роутером. Если её остановить или отключить, вы можете потерять доступ по SSH. Продолжить?`)))return;
    if(verb==='kill'&&!(await ask(`Принудительно завершить «${x.n}» (kill -9, PID ${x.pids.join(', ')})?`)))return;
    info.textContent=`${x.n}: ${verb}…`;
    try{
      const r=await exec(verb==='kill'?'kill -9 '+x.pids.join(' '):`/etc/init.d/${x.n} ${verb}`);
      const out=r.output.trim();
      info.textContent=`${x.n}: ${verb} — ${r.code===0||r.code===null?'готово':'ошибка, код '+r.code}`+(out?'\n'+out:'');
    }catch(e){info.textContent=`${x.n}: ${e}`}
    setTimeout(refresh,600);
  }

  function draw(){
    const q=filter.value.trim().toLowerCase();
    const t=el('table'),hd=el('tr');
    ['Служба','Автозапуск','Состояние','CPU %','RAM %','PID','Действия'].forEach(h=>hd.append(el('th',{},h)));t.append(hd);
    rows.filter(x=>(!q||x.n.toLowerCase().includes(q))&&(!only.checked||x.run)).forEach(x=>{
      const btn=(t,v,off)=>{const p={class:'sm'+(v==='stop'||v==='kill'?' sec':''),onclick:()=>act(x,v)};if(off)p.disabled='';return el('button',p,t)};
      const tr=el('tr',{class:x.run?'':'off'});
      tr.append(el('td',{},el('b',{},x.n)),
        el('td',{},btn(x.en?'✓ вкл':'— выкл',x.en?'disable':'enable')),
        el('td',{},x.run?'● работает':'○ остановлена'),
        el('td',{class:'n'},x.cpu==null?'—':x.cpu.toFixed(1)),
        el('td',{class:'n'},x.mem==null?'—':x.mem.toFixed(1)),
        el('td',{},x.pids.length?x.pids.join(', '):'—'),
        el('td',{},btn('Старт','start',x.run),btn('Перезапуск','restart'),btn('Перезагрузка','reload',!x.run),btn('Стоп','stop',!x.run),btn('Убить','kill',!x.pids.length)));
      t.append(tr)});
    box.replaceChildren(t);
  }
  refresh();
}

function renderPage(){
  const page=(doc.pages||[])[curPage];const box=$('#page');box.replaceChildren();if(!page)return;
  const fields={};
  (page.items||[]).forEach(it=>{
    const card=el('div',{class:'card'});box.append(card);
    if(it.services){renderServices(card)}
    else if(it.field){
      const type=it.type||'text';let input;
      if(type==='choice'){input=el('select');Object.entries(it.options||{}).forEach(([k,v])=>input.append(el('option',{value:v},k)))}
      else{input=el('input',{type:type==='number'?'number':'text',autocapitalize:'off'});if(it.default!=null)input.value=it.default}
      fields[it.field]={def:{...it,type},el:input};
      card.append(el('label',{},it.label||it.field),input);
    }else if(it.button){
      const out=el('pre',{class:'hide'});
      card.append(el('button',{onclick:async()=>{
        out.classList.remove('hide');out.textContent='Выполняется…';
        try{const r=await exec(build(it.run,fields));out.textContent=(r.output||'(пусто)')+(r.code?`\n[код выхода ${r.code}]`:'')}
        catch(e){out.textContent=String(e)}
      }},it.button),out);
    }else if(it.progress){
      const bar=el('progress',{max:100,value:0}),txt=el('div',{},'…');
      const upd=async()=>{
        try{
          const src=it.run?{cmd:it.run,mul:1}:(it.source==='disk'&&it.path)?{mul:1024,cmd:`df -kP ${q(it.path)} | awk 'NR==2{print $2,$3}'`}:SOURCES[it.source];if(!src)throw new Error('Неизвестный source: '+it.source);
          const r=await exec(src.cmd);const [total,used]=r.output.trim().split(/\s+/).map(Number);
          if(!total||isNaN(used))throw new Error('Не удалось разобрать ответ: '+r.output);
          const bytes=total*src.mul;let u=it.unit;if(!u||u==='auto')u=bytes>=1073741824?'GB':bytes>=1048576?'MB':'KB';const k=(UNITS[u]||1)/src.mul,dec=u==='GB'?2:u==='MB'?1:0;
          bar.value=used/total*100;txt.textContent=`${(used/k).toFixed(dec)} из ${(total/k).toFixed(dec)} ${u} (${(used/total*100).toFixed(0)}%)`;
        }catch(e){txt.textContent=String(e);txt.className='err'}
      };
      card.append(el('b',{},it.progress),bar,txt,el('button',{class:'sec',onclick:upd},'Обновить'));upd();
    }
  });
}
renderFavs();
</script>
</body>
</html>
